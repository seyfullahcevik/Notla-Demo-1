<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NotLa | Hepsi Bir Arada Akıllı Not & Görev Asistanı</title>
    <!-- Sekme İkonu (Favicon) -->
    <link rel="icon" type="image/svg+xml" href="https://api.iconify.design/lucide:check-square.svg?color=%234f46e5">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' };
        // TEMA DÜZELTMESİ: Sayfa HTML'i okunurken temayı anında uygula (Gecikmeyi önler)
        const savedTheme = localStorage.getItem('notla_theme');
        if (savedTheme === 'dark') {
            document.documentElement.classList.add('dark');
        }
    </script>
    <!-- Quill.js (Zengin Metin Editörü) -->
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
    <!-- SortableJS (Sürükle-Bırak) -->
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- html2pdf.js (PDF Dışa Aktarma) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <!-- localForage (IndexedDB tabanlı yüksek kapasiteli depolama) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        /* Tema Stilleri */
        .theme-dark { background-color: #0f172a; color: #f1f5f9; }
        .theme-dark .bg-card { background-color: #1e293b; border-color: #334155; }
        .theme-dark aside { background-color: #020617; border-color: #1e293b; }
        .theme-dark header { background-color: #0f172a; border-color: #1e293b; }

        /* Yazı Kaybolma / Geçiş Hatalarını Düzelten Yumuşak Transizyonlar */
        body, aside, header, main, .bg-card, .note-card, input, select, button, .nav-btn, 
        .calendar-day, .calendar-event, #settingsModalContent, #editorModalContent {
            transition-property: background-color, border-color, color, fill, stroke, box-shadow, transform;
            transition-duration: 300ms;
            transition-timing-function: ease-in-out;
        }

        /* Temel Kart Arka Planı ve Renk Modları Geçişi */
        .bg-card { background-color: #ffffff; }

        /* Renk Kodlaması: Uyumluluk ve Geçişler */
        .note-color-red { background-color: #fee2e2; border-color: #fca5a5; }
        .note-color-yellow { background-color: #fef3c7; border-color: #fcd34d; }
        .note-color-green { background-color: #dcfce7; border-color: #86efac; }
        .note-color-blue { background-color: #dbeafe; border-color: #93c5fd; }
        .note-color-purple { background-color: #f3e8ff; border-color: #d8b4fe; }

        .theme-dark .note-color-red { background-color: rgba(220, 38, 38, 0.15); border-color: rgba(220, 38, 38, 0.3); }
        .theme-dark .note-color-yellow { background-color: rgba(217, 119, 6, 0.15); border-color: rgba(217, 119, 6, 0.3); }
        .theme-dark .note-color-green { background-color: rgba(22, 163, 74, 0.15); border-color: rgba(22, 163, 74, 0.3); }
        .theme-dark .note-color-blue { background-color: rgba(37, 99, 235, 0.15); border-color: rgba(37, 99, 235, 0.3); }
        .theme-dark .note-color-purple { background-color: rgba(147, 51, 234, 0.15); border-color: rgba(147, 51, 234, 0.3); }

        /* Quill Editor Özelleştirme */
        .ql-toolbar.ql-snow { border: none !important; border-bottom: 1px solid #e2e8f0 !important; background: #f8fafc; border-radius: 0 !important; }
        .theme-dark .ql-toolbar.ql-snow { background: #1e293b; border-bottom-color: #334155 !important; }
        .theme-dark .ql-snow .ql-stroke { stroke: #f1f5f9; }
        .theme-dark .ql-snow .ql-fill { fill: #f1f5f9; }
        .theme-dark .ql-snow .ql-picker { color: #f1f5f9; }
        .theme-dark .ql-editor.ql-blank::before { color: #94a3b8; }
        .theme-dark .ql-editor { color: #f1f5f9; }
        
        .ql-container { font-size: 1.1rem; height: calc(100% - 42px) !important; min-height: 250px; }
        .ql-editor { height: 100%; min-height: 250px; }

        .note-card { cursor: pointer; position: relative; }
        .note-card:hover { transform: translateY(-3px); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
        
        /* Mobil Uyumlu Grid */
        .grid-view { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1rem; }
        @media (min-width: 640px) { .grid-view { gap: 1.5rem; } }
        
        .list-view { display: flex; flex-direction: column; gap: 0.75rem; }
        .list-view .note-card { display: flex; align-items: center; justify-content: space-between; padding: 1rem; }

        .spinner {
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top: 2px solid #fff;
            border-radius: 50%;
            width: 16px;
            height: 16px;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        /* Custom Scrollbar */
        .custom-scrollbar::-webkit-scrollbar { width: 4px; height: 4px; }
        @media (min-width: 640px) { .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; } }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .theme-dark .custom-scrollbar::-webkit-scrollbar-thumb { background: #475569; }
    </style>
</head>
<body class="bg-gray-50 text-slate-900 overflow-hidden">
    <!-- Giriş Ekranı (Landing Page) -->
    <div id="loginScreen" class="fixed inset-0 bg-slate-50 dark:bg-slate-900 z-[100] flex flex-col items-center justify-center p-4 transition-opacity duration-500">
        <div class="bg-white dark:bg-slate-800 p-8 rounded-3xl shadow-2xl max-w-md w-full text-center border border-slate-100 dark:border-slate-700">
            <div class="w-16 h-16 bg-indigo-600 text-white rounded-2xl flex items-center justify-center mx-auto mb-6 shadow-lg shadow-indigo-500/50">
                <i data-lucide="check-square" class="w-8 h-8"></i>
            </div>
            <h1 class="text-3xl font-bold text-slate-800 dark:text-white mb-2">NotLa</h1>
            <p class="text-slate-500 dark:text-slate-400 mb-8 text-sm">Notlarınızı ve görevlerinizi tüm cihazlarınızdan güvenle yönetin.</p>
            
            <!-- Ana Giriş Butonları -->
            <div id="mainLoginButtons" class="space-y-3">
                <button onclick="loginWithGoogle()" class="w-full flex items-center justify-center gap-3 bg-white dark:bg-slate-700 border border-slate-200 dark:border-slate-600 hover:bg-slate-50 dark:hover:bg-slate-600 text-slate-700 dark:text-white px-6 py-3 rounded-xl font-semibold transition active:scale-95 shadow-sm">
                    <svg class="w-5 h-5" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
                    Google ile Devam Et
                </button>
                <button onclick="loginWithApple()" class="w-full flex items-center justify-center gap-3 bg-black hover:bg-gray-900 text-white px-6 py-3 rounded-xl font-semibold transition active:scale-95 shadow-sm">
                    <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M12 2C6.477 2 2 6.477 2 12c0 4.991 3.657 9.128 8.438 9.879V15.32H7.558v-3.32h2.88v-2.12c0-2.845 1.701-4.414 4.282-4.414 1.242 0 2.544.223 2.544.223v2.793h-1.434c-1.411 0-1.849.877-1.849 1.776v2.164h3.14l-.502 3.32h-2.638v6.559C18.343 21.128 22 16.991 22 12c0-5.523-4.477-10-10-10z" style="display:none"/><path d="M16.365 14.281c.026 2.766 2.457 3.693 2.483 3.704-.022.072-.387 1.332-1.328 2.716-.814 1.196-1.684 2.385-3.003 2.408-1.29.023-1.716-.764-3.195-.764-1.477 0-1.948.74-3.175.787-1.341.047-2.327-1.285-3.146-2.463-1.666-2.405-2.946-6.79-1.246-9.742.843-1.464 2.37-2.392 3.993-2.416 1.267-.023 2.46.85 3.224.85.762 0 2.21-1.047 3.743-.895 1.58.07 3.013.639 3.864 1.884-.07.045-2.261 1.323-2.215 3.931z"/><path d="M14.996 5.86c.691-.837 1.157-2.003 1.03-3.16-1.006.04-2.221.669-2.932 1.503-.637.742-1.194 1.93-.105 3.064.08.064 1.11.758 2.007-.274V5.86z"/></svg>
                    Apple ile Devam Et
                </button>
                <button onclick="showPhoneLoginUI()" class="w-full flex items-center justify-center gap-3 bg-slate-100 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 hover:bg-slate-200 dark:hover:bg-slate-600 text-slate-700 dark:text-white px-6 py-3 rounded-xl font-semibold transition active:scale-95 shadow-sm">
                    <i data-lucide="phone" class="w-5 h-5 text-slate-500 dark:text-slate-300"></i> Telefon ile Giriş Yap
                </button>
                <button onclick="continueAsGuest()" class="w-full flex items-center justify-center gap-3 bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-3 rounded-xl font-semibold transition shadow-md shadow-indigo-200 dark:shadow-none active:scale-95 mt-2">
                    Giriş Yapmadan Devam Et
                </button>
            </div>

            <!-- Telefon ile Giriş Arayüzü (Başlangıçta Gizli) -->
            <div id="phoneLoginUI" class="hidden flex-col gap-4">
                <!-- 1. Adım: Telefon Numarası Gir -->
                <div id="phoneStep1" class="flex flex-col gap-3">
                    <p class="text-sm text-slate-600 dark:text-slate-300 font-medium">Telefon numaranızı girin</p>
                    
                    <div class="flex gap-2">
                        <!-- Kaydırmalı Alan Kodu Seçici -->
                        <select id="countryCodeSelect" class="w-1/3 sm:w-1/4 px-1 sm:px-2 py-3 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 text-center text-sm sm:text-base font-semibold dark:text-white cursor-pointer custom-scrollbar">
                            <option value="+90">🇹🇷 +90</option>
                            <option value="+1">🇺🇸 +1</option>
                            <option value="+44">🇬🇧 +44</option>
                            <option value="+49">🇩🇪 +49</option>
                            <option value="+33">🇫🇷 +33</option>
                            <option value="+7">🇷🇺 +7</option>
                            <option value="+994">🇦🇿 +994</option>
                        </select>
                        
                        <!-- Bitişik Yazılacak Telefon Numarası -->
                        <input type="tel" id="phoneNumberInput" placeholder="5551234567" class="flex-1 px-4 py-3 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 text-lg font-bold dark:text-white tracking-widest placeholder-slate-400">
                    </div>

                    <div class="flex gap-2 mt-1">
                        <button onclick="cancelPhoneLogin()" class="flex-1 py-3 bg-slate-200 hover:bg-slate-300 dark:bg-slate-700 dark:hover:bg-slate-600 text-slate-700 dark:text-white rounded-xl font-semibold transition shadow-sm">İptal</button>
                        <button onclick="sendSMSCode()" class="flex-1 py-3 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-semibold transition shadow-sm">SMS Gönder</button>
                    </div>
                </div>

                <!-- 2. Adım: SMS Kodu Doğrulama -->
                <div id="phoneStep2" class="hidden flex-col gap-3">
                    <p class="text-sm text-slate-600 dark:text-slate-300 font-medium">Telefonunuza gelen 6 haneli kodu girin</p>
                    <input type="number" id="smsCodeInput" placeholder="123456" class="w-full px-4 py-3 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 text-center text-xl font-bold dark:text-white tracking-[0.5em]">
                    <div class="flex gap-2">
                        <button onclick="cancelPhoneLogin()" class="flex-1 py-3 bg-slate-200 hover:bg-slate-300 dark:bg-slate-700 dark:hover:bg-slate-600 text-slate-700 dark:text-white rounded-xl font-semibold transition">İptal</button>
                        <button onclick="verifySMSCode()" class="flex-1 py-3 bg-green-600 hover:bg-green-700 text-white rounded-xl font-semibold transition">Doğrula</button>
                    </div>
                </div>
                
                <!-- Firebase reCAPTCHA kapsayıcısı -->
                <div id="recaptcha-container"></div>
            </div>
            <p id="loginStatusMsg" class="mt-4 text-xs text-slate-400 hidden"></p>
        </div>
    </div>

    <div id="app" class="flex h-screen w-full relative">
        <!-- Mobil Sidebar Arka Plan Karartması -->
        <div id="sidebarBackdrop" onclick="toggleSidebar()" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-30 hidden md:hidden transition-opacity opacity-0"></div>

        <!-- Yan Menü (Mobil Duyarlı) -->
        <aside id="sidebar" class="absolute md:relative inset-y-0 left-0 w-64 bg-white dark:bg-slate-900 border-r dark:border-slate-800 flex flex-col shrink-0 z-40 transition-transform duration-300 ease-in-out transform -translate-x-full md:translate-x-0 h-screen md:h-full shadow-2xl md:shadow-none">
            <div class="p-6 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="bg-indigo-600 text-white p-2 rounded-xl shadow-lg shadow-indigo-500/50 dark:shadow-[0_0_15px_rgba(79,70,229,0.5)]">
                        <i data-lucide="check-square"></i>
                    </div>
                    <h1 class="text-2xl font-bold tracking-tight text-slate-800 dark:text-white">NotLa</h1>
                </div>
                <!-- Mobil Sidebar Kapatma Butonu -->
                <button onclick="toggleSidebar()" class="md:hidden p-2 text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-lg">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <nav class="flex-1 px-4 space-y-1 overflow-y-auto custom-scrollbar">
                <div class="px-3 text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-2 mt-2">Görünümler</div>
                <button onclick="setFilter('notes')" class="nav-btn active w-full flex items-center gap-3 px-3 py-3 md:py-2.5 rounded-xl hover:bg-indigo-50 dark:hover:bg-slate-800 text-left transition text-sm font-medium text-slate-700 dark:text-slate-300" data-filter="notes">
                    <i data-lucide="book-open" class="w-5 h-5 md:w-4 md:h-4"></i> Notlarım
                </button>
                <button onclick="setFilter('tasks')" class="nav-btn w-full flex items-center gap-3 px-3 py-3 md:py-2.5 rounded-xl hover:bg-indigo-50 dark:hover:bg-slate-800 text-left transition text-sm font-medium text-slate-700 dark:text-slate-300" data-filter="tasks">
                    <i data-lucide="check-circle" class="w-5 h-5 md:w-4 md:h-4"></i> Görevlerim
                </button>
                <button onclick="setFilter('favorites')" class="nav-btn w-full flex items-center gap-3 px-3 py-3 md:py-2.5 rounded-xl hover:bg-indigo-50 dark:hover:bg-slate-800 text-left transition text-sm font-medium text-slate-700 dark:text-slate-300" data-filter="favorites">
                    <i data-lucide="star" class="w-5 h-5 md:w-4 md:h-4"></i> Önemli
                </button>
                <button onclick="setFilter('trash')" class="nav-btn w-full flex items-center gap-3 px-3 py-3 md:py-2.5 rounded-xl hover:bg-indigo-50 dark:hover:bg-slate-800 text-left transition text-sm font-medium text-red-500 dark:text-red-400" data-filter="trash">
                    <i data-lucide="trash-2" class="w-5 h-5 md:w-4 md:h-4"></i> Çöp Kutusu
                </button>

                <!-- Ayarlar Butonu Etiketlerin Üstüne Taşındı -->
                <button onclick="openSettings()" class="w-full flex items-center gap-3 px-3 py-3 md:py-2.5 rounded-xl hover:bg-indigo-50 dark:hover:bg-slate-800 text-left transition text-sm font-medium text-slate-700 dark:text-slate-300 mt-6">
                    <i data-lucide="settings" class="w-5 h-5 md:w-4 md:h-4 text-slate-500"></i> Ayarlar
                </button>

                <div class="mt-6 mb-2 px-3 text-[10px] font-bold text-slate-400 uppercase tracking-widest">Etiketler</div>
                <div id="tagList" class="space-y-1">
                    <!-- Dinamik Etiketler -->
                </div>
            </nav>
        </aside>

        <!-- Ana Alan -->
        <main class="flex-1 flex flex-col relative min-w-0 w-full h-full">
            <!-- Header -->
            <header class="h-16 md:h-20 flex items-center justify-between px-4 md:px-8 bg-white/80 backdrop-blur-md sticky top-0 z-10 border-b dark:bg-slate-900/80 dark:border-slate-800">
                <!-- Mobil Hamburger Menü İkonu -->
                <button onclick="toggleSidebar()" class="md:hidden p-2 mr-2 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-lg">
                    <i data-lucide="menu" class="w-6 h-6"></i>
                </button>

                <div class="flex-1 max-w-xl relative" id="searchContainer">
                    <i data-lucide="search" class="absolute left-3 md:left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400"></i>
                    <input type="text" id="searchBox" oninput="handleSearch()" placeholder="Ara..." class="w-full pl-9 md:pl-11 pr-4 py-2 md:py-2.5 bg-slate-100 dark:bg-slate-800 rounded-xl md:rounded-2xl focus:outline-none focus:ring-2 focus:ring-indigo-500/20 transition text-sm dark:text-white border border-transparent dark:border-slate-700">
                </div>

                <div class="flex items-center gap-2 md:gap-4 ml-2 md:ml-6">
                    <button id="calendarToggleBtn" onclick="toggleCalendarMode()" class="relative p-2 bg-gradient-to-r from-indigo-50 to-purple-50 dark:from-indigo-900/40 dark:to-purple-900/40 border border-indigo-100 dark:border-indigo-800/60 rounded-xl transition flex items-center justify-center shadow-sm hover:shadow-md hover:shadow-indigo-500/20 group overflow-hidden" title="Takvim (Planlananlar)">
                        <div class="absolute inset-0 bg-gradient-to-r from-indigo-500 to-purple-500 opacity-0 group-hover:opacity-10 transition-opacity"></div>
                        <i data-lucide="calendar" id="calendarIcon" class="w-5 h-5 text-indigo-600 dark:text-indigo-400 transform group-hover:scale-110 transition-transform"></i>
                    </button>
                    <button id="viewToggleBtn" onclick="toggleView()" class="hidden md:flex p-2 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-xl transition" title="Görünümü Değiştir">
                        <i data-lucide="grid" id="viewIcon" class="w-5 h-5 text-slate-600 dark:text-slate-300"></i>
                    </button>
                    <!-- Masaüstü Yeni Butonu -->
                    <button onclick="createNewItem()" class="hidden md:flex bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2.5 rounded-xl items-center gap-2 text-sm font-semibold shadow-lg shadow-indigo-200 transition active:scale-95" id="mainAddBtn">
                        <i data-lucide="plus" class="w-4 h-4" id="mainAddBtnIcon"></i> <span id="mainAddBtnText">Yeni Not</span>
                    </button>
                </div>
            </header>

            <!-- Notlar Grid / Calendar / Tasks Container -->
            <div id="notesContainer" class="flex-1 overflow-y-auto p-4 md:p-8 custom-scrollbar pb-24 md:pb-8">
                <!-- İçerik JavaScript ile buraya gelecek -->
            </div>

            <!-- Mobil Yüzen Yeni Butonu (FAB) -->
            <button onclick="createNewItem()" class="md:hidden fixed bottom-6 right-6 w-14 h-14 bg-indigo-600 rounded-full flex items-center justify-center text-white shadow-[0_4px_20px_rgba(79,70,229,0.5)] z-20 active:scale-90 transition-transform">
                <i data-lucide="plus" class="w-6 h-6"></i>
            </button>
        </main>
    </div>

    <!-- Editör Modalı (Mobilde Tam Ekran) -->
    <div id="editorModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center sm:p-4 opacity-0 transition-opacity duration-300">
        <div class="bg-white dark:bg-slate-900 w-full h-full sm:max-w-5xl sm:h-[95vh] sm:rounded-3xl shadow-2xl flex flex-col overflow-hidden transform transition-transform duration-300 scale-95" id="editorModalContent">
            
            <!-- Modal Header -->
            <div class="p-3 sm:p-4 border-b flex items-center justify-between gap-2 dark:border-slate-800 bg-white dark:bg-slate-900 z-10 shrink-0">
                <!-- Mobilde geri butonu ekle -->
                <button onclick="saveAndClose()" class="sm:hidden p-2 text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-lg shrink-0">
                    <i data-lucide="arrow-left" class="w-5 h-5"></i>
                </button>

                <!-- Checkbox ve Title Alanı -->
                <div class="flex items-center flex-1 min-w-0 pr-2 gap-2 sm:gap-3">
                    <button id="modalTaskCheck" onclick="toggleCurrentTaskCheck()" class="hidden w-6 h-6 sm:w-7 sm:h-7 rounded-full border-2 items-center justify-center shrink-0 transition-colors"></button>
                    <input type="text" id="noteTitle" placeholder="Başlıksız Not" class="text-xl sm:text-2xl font-bold bg-transparent outline-none flex-1 min-w-0 px-2 dark:text-white placeholder-slate-300 dark:placeholder-slate-600 truncate transition-colors">
                </div>

    <script>
        // Firebase Başlatma
        const firebaseConfig = {

            authDomain: "notlauygulama.firebaseapp.com",
            projectId: "notlauygulama",

            messagingSenderId: "3425944822",
            appId: "1:3425944822:web:90cf3e9e8c1c8d6efd98d7"
        };
        firebase.initializeApp(firebaseConfig);

        let notes = [];
        let trash = [];
        let currentNoteId = null;
        let currentFilter = localStorage.getItem('notla_filter') || 'notes'; 
        let viewMode = localStorage.getItem('notla_view') || 'grid';
        let currentTheme = localStorage.getItem('notla_theme') || 'light';
        let spellcheckEnabled = localStorage.getItem('notla_spellcheck') !== 'false';
        let currentCalendarDate = new Date();
        let editor;
        let sortableInstance = null;

        if ("Notification" in window && Notification.permission !== "granted" && Notification.permission !== "denied") {
            Notification.requestPermission();
        }

        const debounce = (func, delay) => {
            let timer;
            return function (...args) {
                clearTimeout(timer);
                timer = setTimeout(() => func.apply(this, args), delay);
            };
        };

        const debouncedSaveToStorage = debounce(() => {
            saveToStorage();
            const status = document.getElementById('saveStatus');
            if(!status) return;
            status.innerText = 'Kaydedildi';
            status.classList.remove('text-indigo-500');
            status.classList.add('text-slate-400');
            if(currentFilter === 'calendar') renderCalendar();
        }, 800);

        window.continueAsGuest = function() {
            const loginScreen = document.getElementById('loginScreen');
            if(loginScreen) {
                loginScreen.classList.add('opacity-0');
                setTimeout(() => {
                    loginScreen.classList.add('hidden');
                    if (typeof lucide !== 'undefined') lucide.createIcons();
                }, 500);
            }
        };

        window.loginWithGoogle = function() {
            const statusMsg = document.getElementById('loginStatusMsg');
            if(statusMsg) {
                statusMsg.classList.remove('hidden', 'text-red-500', 'text-green-500');
                statusMsg.innerText = "Google ile bağlantı kuruluyor...";
                
                const provider = new firebase.auth.GoogleAuthProvider();
                provider.addScope('https://www.googleapis.com/auth/calendar.events'); 

                firebase.auth().signInWithPopup(provider)
                .then((result) => {
                    const credential = firebase.auth.GoogleAuthProvider.credentialFromResult(result);
                    if(credential && credential.accessToken) {
                        sessionStorage.setItem('google_api_token', credential.accessToken);
                    }
                    statusMsg.innerText = "Giriş başarılı! Yönlendiriliyorsunuz...";
                    statusMsg.classList.add('text-green-500');

        // --- SENKRONİZASYON & VERİTABANI İŞLEMLERİ ---
        async function importSharedNote(sId, type) {
            try {
                const doc = await firebase.firestore().collection('shared_notes').doc(sId).get();
                if(doc.exists) {
                    const data = doc.data(); const noteId = type === 'linked' ? sId : Date.now().toString(); 
                    const newNote = {
                        id: noteId, type: 'note', title: type === 'linked' ? data.title : data.title + " (Kopya)", content: data.content,
                        tags: type === 'linked' ? ['Ortak Not'] : ['Kopya'], color: type === 'linked' ? '#dbeafe' : 'white',
                        isFavorite: false, reminder: null, location: '', attachments: [], createdAt: new Date().toISOString(), updatedAt: new Date().toISOString()
                    };
                    if (type === 'linked') { newNote.isSharedWithMe = true; newNote.shareId = sId; newNote.shareMode = data.mode; }
                    notes = notes.filter(n => n.id !== newNote.id); notes.unshift(newNote); saveToStorage();
                    alert(type === 'linked' ? "✅ Ortak not eklendi! Orijinal değişiklikler buraya yansıyacaktır." : "✅ Notun bağımsız bir kopyası defterinize eklendi.");
                    window.location.href = window.location.origin + window.location.pathname;
                }
            } catch(err) { console.error(err); alert("Not eklenirken hata oluştu."); }
        }

        async function syncSharedNotes() {
            let hasChanges = false;
            for (let i = 0; i < notes.length; i++) {
                let note = notes[i];
                if (note.shareId) {
                    try {
                        const doc = await firebase.firestore().collection('shared_notes').doc(note.shareId).get();
                        if (doc.exists) {
                            const data = doc.data();
                            if (note.isSharedWithMe) {
                                if (note.content !== data.content || note.title !== data.title || note.shareMode !== data.mode) {
                                    note.content = data.content; note.title = data.title; note.shareMode = data.mode; hasChanges = true;
                                }
                            }
                        } else {
                            if (note.isSharedWithMe) { notes.splice(i, 1); i--; hasChanges = true; } 
                            else { delete note.shareId; delete note.shareMode; delete note.shareAccessType; delete note.sharedEmails; hasChanges = true; }
                        }
                    } catch(e) {}
                }
            }
            if (hasChanges) { saveToStorage(); renderNotes(); }
        }

                firebase.firestore().collection('shared_notes').doc(note.shareId).update({ title: note.title, content: note.content, updatedAt: new Date().toISOString() }).catch(e => {});
            }
        }

        // --- GOOGLE TAKVİM ENTEGRASYONU ---
        async function addToGoogleCalendar() {
            if (!currentNoteId) return;
            const note = notes.find(n => n.id === currentNoteId);
            
            if (!note || !note.reminder) {
                alert("Lütfen önce sol taraftan bu görev için bir tarih ve saat seçin.");
                return;
            }

            let token = sessionStorage.getItem('google_api_token');
            
            // AKILLI KONTROL: Eğer token yoksa (sayfa yenilenmişse), anında kullanıcıdan tekrar izin iste.
            if (!token) {
                try {
                    const status = document.getElementById('saveStatus');
                    if(status) {
                        status.innerText = 'Takvim İzni İsteniyor...';
                        status.classList.remove('text-slate-400');
                        status.classList.add('text-indigo-500');
                    }
                    
                    const provider = new firebase.auth.GoogleAuthProvider();
                    provider.addScope('https://www.googleapis.com/auth/calendar.events');
                    
                    // KRİTİK EKLENTİ: Google'ı her seferinde izin ekranını göstermeye ZORLA!
                    provider.setCustomParameters({
                        prompt: 'consent'
                    });
                    
                    // Giriş ekranına atmadan anında pop-up açarak izni tazele
                    const result = await firebase.auth().signInWithPopup(provider);
                    const credential = firebase.auth.GoogleAuthProvider.credentialFromResult(result);
                    
                    if(credential && credential.accessToken) {
                        token = credential.accessToken;
                        sessionStorage.setItem('google_api_token', token);
                    } else {
                        throw new Error("Erişim anahtarı alınamadı.");
                    }
                } catch (error) {
                    console.error("Takvim yetkisi hatası:", error);
                    // Hatanın tam sebebini ekrana yazdırıyoruz ki pop-up mı engellendi bilelim.
                    alert("Takvim İzni Alınamadı!\n\nHata: " + error.message + "\n\nLütfen tarayıcınızın 'Açılır Pencere (Pop-up)' engelleyicisini kapatıp tekrar deneyin.");
                    
                    const status = document.getElementById('saveStatus');
                    if(status) {
                        status.innerText = 'Takvim Hatası';
                        status.classList.replace('text-indigo-500', 'text-red-500');
                    }
                    return;
                }
            }

            const status = document.getElementById('saveStatus');
            if(status) {
                status.innerText = 'Takvime Ekleniyor...';
                status.classList.remove('text-slate-400');
                status.classList.add('text-indigo-500');
            }

            const startTime = new Date(note.reminder);
            // Varsayılan etkinlik süresi: 1 saat
            const endTime = new Date(startTime.getTime() + 60 * 60 * 1000); 
            
            // Editördeki HTML etiketlerini (<b>, <ul> vs) temizleyip düz yazıya çeviriyoruz
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = note.content || '';
            const plainText = tempDiv.textContent || tempDiv.innerText || '';

            // Google Calendar API Formatı
            const event = {
                summary: note.title || 'NotLa Görevi',
                description: plainText + "\n\n---\nBu görev NotLa uygulaması üzerinden oluşturulmuştur.",
                location: note.location || '',
                start: {
                    dateTime: startTime.toISOString(),
                    timeZone: Intl.DateTimeFormat().resolvedOptions().timeZone
                },
                end: {
                    dateTime: endTime.toISOString(),
                    timeZone: Intl.DateTimeFormat().resolvedOptions().timeZone
                }
            };

            try {
                const response = await fetch('https://www.googleapis.com/calendar/v3/calendars/primary/events', {
                    method: 'POST',
                    headers: {
                        'Authorization': 'Bearer ' + token,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(event)
                });
                
                if (response.ok) {
                    alert('✅ Etkinlik Google Takvimine başarıyla eklendi!');
                    if(status) {
                        status.innerText = 'Takvime Eklendi';
                        status.classList.replace('text-indigo-500', 'text-green-500');
                    }
                } else {
                    const errData = await response.json();
                    console.error("Takvim Hatası:", errData);
                    if (errData.error && errData.error.code === 401) {
                         // Süre dolduysa (1 saat geçer) bellekteki eski token'ı sil
                         sessionStorage.removeItem('google_api_token');
                         alert("Takvim erişim izninizin süresi dolmuş. Lütfen butona tekrar basarak izni tazeleyin.");
                    } else {
                         alert("Takvime eklenirken hata oluştu.");
                    }
                }
            } catch (e) {
                console.error("Fetch hatası:", e);
                alert("Google Takvim'e bağlanılamadı. Lütfen internet bağlantınızı kontrol edin.");
            }
        }

        // --- VERİ YÖNETİMİ (YEDEK/SİL) ---
        function exportBackup() {
            const data = { notes, trash, exportDate: new Date().toISOString() };
            const blob = new Blob([JSON.stringify(data, null, 2)], {type: "application/json"}); const url = URL.createObjectURL(blob);
            const a = document.createElement('a'); a.href = url; a.download = `NotLa_Yedek_${new Date().toLocaleDateString('tr-TR').replace(/\./g, '-')}.json`;
            a.click(); URL.revokeObjectURL(url);
        }

        function importBackup(e) {
            const file = e.target.files[0]; if (!file) return; const reader = new FileReader();
            reader.onload = function(evt) {
                try {
                    const data = JSON.parse(evt.target.result);
                    if (data.notes && Array.isArray(data.notes)) {
                        if(confirm("DİKKAT: Mevcut notlarınızın üzerine yazılacak. Onaylıyor musunuz?")) {
                            notes = data.notes; trash = data.trash || []; saveToStorage(); renderNotes(); closeSettings(); alert("Yedek başarıyla yüklendi!");
                        }
                    } else { alert("HATA: Geçersiz yedek dosyası."); }

            }; reader.readAsText(file); e.target.value = '';
        }

        // --- ÇIKIŞ YAPMA İŞLEMİ ---
        function logoutUser() {
            if(confirm("Hesabınızdan çıkış yapmak istediğinize emin misiniz?")) {
                firebase.auth().signOut().then(() => {
                    notes = []; trash = [];

        function saveToStorage() {
            const user = firebase.auth().currentUser;
            if (user) {
                firebase.firestore().collection('user_notes').doc(user.uid).set({ notes: notes, trash: trash, updatedAt: new Date().toISOString() }).catch(err => { console.error("Buluta kayıt hatası:", err); });
            }
            localforage.setItem('notla_notes', notes).catch(err => console.error(err));
            localforage.setItem('notla_trash', trash).catch(err => console.error(err));
        }

        // --- DOSYA EKLERİ ---
        function handleFileUpload(event) {
            const files = event.target.files; if(!files.length || !currentNoteId) return;
            const note = notes.find(n => n.id === currentNoteId); if(!note) return;
            Array.from(files).forEach(file => {
                if(file.size > 5 * 1024 * 1024) { alert(`${file.name} çok büyük (Maks. 5MB).`); return; }
                const reader = new FileReader();
                reader.onload = function(e) {
                    if(!note.attachments) note.attachments = [];
                    note.attachments.push({ name: file.name, type: file.type, data: e.target.result, id: Date.now().toString() + Math.random().toString(36).substr(2, 5) });
                    triggerAutoSaveUI(); renderAttachments();
                }; reader.readAsDataURL(file);
            }); event.target.value = '';
        }

        function renderAttachments() {
            const list = document.getElementById('attachmentList'); list.innerHTML = '';
            const note = notes.find(n => n.id === currentNoteId); if(!note || !note.attachments || note.attachments.length === 0) return;
            note.attachments.forEach(att => {
                const isImage = att.type.startsWith('image/'); const el = document.createElement('div');
                el.className = 'flex items-center gap-2 bg-slate-100 dark:bg-slate-800 px-3 py-1.5 rounded-lg border dark:border-slate-700 text-xs sm:text-sm group';
                el.innerHTML = `<i data-lucide="${isImage ? 'image' : 'file'}" class="w-3 h-3 sm:w-4 sm:h-4 text-slate-500"></i><a href="${att.data}" download="${att.name}" class="text-indigo-600 dark:text-indigo-400 font-medium hover:underline truncate max-w-[100px] sm:max-w-[150px]">${att.name}</a><button onclick="removeAttachment('${att.id}')" class="text-slate-400 hover:text-red-50 ml-1 sm:ml-2 p-1"><i data-lucide="x" class="w-3 h-3 sm:w-4 sm:h-4"></i></button>`;
                list.appendChild(el);

        function removeAttachment(id) {
            if(!currentNoteId) return; const note = notes.find(n => n.id === currentNoteId);
            if(note && note.attachments) { note.attachments = note.attachments.filter(a => a.id !== id); triggerAutoSaveUI(); renderAttachments(); }
        }

        // --- DİĞER FONKSİYONLAR ---
        function checkReminders() {
            const now = new Date().getTime(); let changed = false;
            notes.forEach(note => {
                if (note.type === 'task' && note.reminder && !note.reminderShown) {
                    const reminderTime = new Date(note.reminder).getTime();
                    if (now >= reminderTime) { showNotification(note.title || 'İsimsiz Görev', "Hatırlatıcı zamanı geldi!"); note.reminderShown = true; changed = true; }
                }
            }); if(changed) saveToStorage();
        }

        function showNotification(title, body) {
            if ("Notification" in window && Notification.permission === "granted") { new Notification("NotLa: " + title, { body: body, icon: "https://cdn-icons-png.flaticon.com/512/3208/3208703.png" }); } else { alert(`🔔 HATIRLATICI: ${title}\n${body}`); }
        }

        function toggleExportMenu() { document.getElementById('exportMenu').classList.toggle('hidden'); }
        function exportNote(type) {
            const note = notes.find(n => n.id === currentNoteId); if(!note) return; toggleExportMenu(); const title = note.title || 'NotLa_Belgesi';
            if (type === 'txt') {
                const tempDiv = document.createElement('div'); tempDiv.innerHTML = note.content;
                const content = `${title.toUpperCase()}\n\n${tempDiv.innerText || tempDiv.textContent}\n\n---\nOluşturulma: ${new Date(note.createdAt).toLocaleString()}`;
                const blob = new Blob([content], { type: 'text/plain;charset=utf-8' }); const link = document.createElement('a'); link.href = URL.createObjectURL(blob); link.download = `${title}.txt`; link.click();
            } 
            else if (type === 'pdf') {
                const container = document.getElementById('exportContainer');
                container.innerHTML = `<div style="font-family: Arial, sans-serif; padding: 20px;"><h1 style="color: #4f46e5; border-bottom: 2px solid #e5e7eb; padding-bottom: 10px;">${title}</h1><div style="margin-top: 20px; font-size: 14px; line-height: 1.6;">${note.content}</div><div style="margin-top: 40px; font-size: 10px; color: #9ca3af; text-align: center; border-top: 1px solid #e5e7eb; padding-top: 10px;">NotLa Uygulaması • ${new Date().toLocaleString()}</div></div>`;
                container.classList.remove('hidden');
                html2pdf().set({ margin: 1, filename: `${title}.pdf`, image: { type: 'jpeg', quality: 0.98 }, html2canvas: { scale: 2 }, jsPDF: { unit: 'in', format: 'letter', orientation: 'portrait' } }).from(container).save().then(() => { container.classList.add('hidden'); container.innerHTML = ''; });
            }
        }

        function restoreFromTrash(id, e) { e.stopPropagation(); const noteIndex = trash.findIndex(n => n.id === id); if (noteIndex > -1) { notes.unshift(trash.splice(noteIndex, 1)[0]); saveToStorage(); renderNotes(); } }

        function populateToolbarTags() {

            const allTags = [...new Set(notes.flatMap(n => n.tags || []))]; const container = document.getElementById('toolbarTagList'); container.innerHTML = '';
            if (allTags.length === 0) { container.innerHTML = '<span class="text-[10px] text-slate-400 italic">Etiket yok</span>'; return; }

            const id = document.getElementById('activeCardId').value; const note = notes.find(n => n.id === id); if (!note) return;
            if (!note.tags) note.tags = [];

                const newTag = prompt("Yeni oluşturulacak etiket adını girin:");

            } else if (type === 'toggle') {
                if (note.tags.includes(tagValue)) { note.tags = note.tags.filter(t => t !== tagValue); } else { note.tags.push(tagValue); }
                saveToStorage(); renderNotes(); renderTags(); populateToolbarTags();
            }
        }

        // --- Ana Render Yönlendiricisi ---
        function renderNotes() {
            if (currentFilter === 'calendar') { renderCalendar(); return; }
            const searchVal = document.getElementById('searchBox').value.toLowerCase();
            let dataList = currentFilter === 'trash' ? trash : notes;
            let filtered = [];
            
            if (currentFilter === 'notes') { filtered = dataList.filter(n => n.type === 'note'); } 
            else if (currentFilter === 'tasks') { filtered = dataList.filter(n => n.type === 'task'); } 
            else if (currentFilter === 'favorites') { filtered = dataList.filter(n => n.isFavorite); } 
            else if (currentFilter.startsWith('tag:')) { const tag = currentFilter.replace('tag:', ''); filtered = dataList.filter(n => (n.tags || []).includes(tag)); } 
            else { filtered = dataList; }

            if (searchVal) {
                filtered = filtered.filter(n => (n.title && n.title.toLowerCase().includes(searchVal)) || (n.content && n.content.toLowerCase().includes(searchVal)) || (n.tags && n.tags.some(t => t.toLowerCase().includes(searchVal))));
            }

            if (currentFilter === 'tasks') { renderTasksView(filtered); } else { renderCardsView(filtered); }
        }

            const allTags = [...new Set(notes.flatMap(n => n.tags || []))];
            const tagContainer = document.getElementById('tagList'); tagContainer.innerHTML = '';
            allTags.forEach(tag => {
                const btn = document.createElement('button'); const isActive = currentFilter === 'tag:'+tag;
                btn.className = `w-full flex items-center gap-3 px-3 py-3 md:py-2 rounded-xl hover:bg-indigo-50 dark:hover:bg-slate-800 text-left transition text-sm font-medium nav-btn ${isActive ? 'bg-indigo-50 text-indigo-600 dark:bg-slate-800 dark:text-indigo-400' : 'text-slate-700 dark:text-slate-300'}`;
                btn.dataset.filter = 'tag:'+tag;
                btn.onclick = () => { setFilter('tag:' + tag); if(window.innerWidth < 768) toggleSidebar(); };
                btn.innerHTML = `<i data-lucide="hash" class="w-4 h-4"></i> <span class="truncate">${tag}</span>`;
                tagContainer.appendChild(btn);
            });
            lucide.createIcons();
        }

        const handleSearch = debounce(() => { renderNotes(); }, 300);

        function toggleCalendarMode() {
            if (currentFilter === 'calendar') { setFilter(localStorage.getItem('notla_filter') || 'notes'); } else { setFilter('calendar'); }
        }

        function setFilter(filter) {
            if(filter !== 'trash' && !filter.startsWith('tag:')) { localStorage.setItem('notla_filter', filter); }
            currentFilter = filter;
            
            document.querySelectorAll('.nav-btn').forEach(b => {
                b.classList.remove('bg-indigo-50', 'text-indigo-600', 'dark:bg-slate-800', 'dark:text-indigo-400');
                if (b.dataset.filter === 'trash') { b.classList.add('text-red-500', 'dark:text-red-400'); } else { b.classList.add('text-slate-700', 'dark:text-slate-300'); }
                if (b.dataset.filter === filter) {
                    b.classList.remove('text-slate-700', 'dark:text-slate-300', 'text-red-500', 'dark:text-red-400');
                    b.classList.add('bg-indigo-50', 'text-indigo-600', 'dark:bg-slate-800', 'dark:text-indigo-400');
                }
            });

            const addBtnText = document.getElementById('mainAddBtnText');
            if (addBtnText) { addBtnText.innerText = (filter === 'tasks' || filter === 'calendar') ? 'Yeni Görev' : 'Yeni Not'; }

            const calBtn = document.getElementById('calendarToggleBtn'); const calIcon = document.getElementById('calendarIcon');
            if (calBtn && calIcon) {
                if (filter === 'calendar') {
                    calBtn.className = 'relative p-2 bg-gradient-to-r from-indigo-600 to-purple-600 border border-transparent rounded-xl transition-all duration-300 flex items-center justify-center shadow-[0_0_20px_rgba(99,102,241,0.6)] scale-105 group overflow-hidden';
                    calIcon.className = 'w-5 h-5 text-white transform group-hover:scale-110 transition-transform';
                } else {
                    calBtn.className = 'relative p-2 bg-gradient-to-r from-indigo-50 to-purple-50 dark:from-indigo-900/40 dark:to-purple-900/40 border border-indigo-100 dark:border-indigo-800/60 rounded-xl transition-all duration-300 flex items-center justify-center shadow-sm hover:shadow-md hover:shadow-indigo-500/20 group overflow-hidden';
                    calIcon.className = 'w-5 h-5 text-indigo-600 dark:text-indigo-400 transform group-hover:scale-110 transition-transform';
                }
            }
            if(window.innerWidth < 768 && filter !== 'calendar' && filter !== currentFilter) { toggleSidebar(); }
            renderNotes();
        }

        function toggleView() {
            viewMode = viewMode === 'grid' ? 'list' : 'grid'; localStorage.setItem('notla_view', viewMode);
            document.getElementById('viewIcon').setAttribute('data-lucide', viewMode === 'grid' ? 'list' : 'grid'); renderNotes();
        }

        window.onclick = function(event) {
            if (!event.target.closest('button[onclick="toggleExportMenu()"]') && !event.target.closest('#exportMenu')) {
                const exMenu = document.getElementById('exportMenu'); if (exMenu) exMenu.classList.add('hidden');
            }
            if (event.target.id === 'settingsModal') { closeSettings(); }
            const toolbar = document.getElementById('cardToolbar');
            if (toolbar && !toolbar.classList.contains('hidden') && !event.target.closest('.note-card') && !event.target.closest('#cardToolbar')) { closeCardToolbar(); }
        }
    </script>
</body>
</html>
