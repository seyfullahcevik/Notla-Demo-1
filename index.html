                            </div>
                            <div class="flex gap-1 shrink-0 ml-2">
                                ${currentFilter === 'trash' ? `
                                    <button onclick="restoreFromTrash('${note.id}', event)" title="Geri Yükle" class="p-1.5 hover:bg-green-100 rounded-lg text-green-600 transition"><i data-lucide="rotate-ccw" class="w-4 h-4"></i></button>
                                    <button onclick="permanentDelete('${note.id}', event)" title="Tamamen Sil" class="p-1.5 hover:bg-red-100 rounded-lg text-red-600 transition"><i data-lucide="x-circle" class="w-4 h-4"></i></button>
                                ` : `
                                    <button onclick="toggleFavorite('${note.id}', event)" class="p-1.5 hover:bg-orange-50 dark:hover:bg-slate-700 rounded-lg ${note.isFavorite ? 'text-orange-500' : 'text-slate-400'} transition">
    <i data-lucide="star" class="w-4 h-4" ${note.isFavorite ? 'fill="currentColor"' : ''}></i>
</button>
                                    <button onclick="moveToTrash('${note.id}', event)" class="p-1.5 hover:bg-red-50 dark:hover:bg-slate-700 rounded-lg text-slate-400 hover:text-red-500 transition"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                                `}
                            </div>
                        </div>
                        <p class="text-xs sm:text-sm text-slate-600 dark:text-slate-400 line-clamp-3 sm:line-clamp-4 mb-3 sm:mb-4 flex-1">${preview || '<i class="opacity-40 font-normal">İçerik boş...</i>'}</p>
                        
                        <div class="flex items-center justify-between mt-auto pt-3 sm:pt-4 border-t border-slate-200/50 dark:border-slate-700/50">
                            <div class="flex flex-wrap gap-1.5 overflow-hidden h-5 sm:h-6">
                                ${note.tags && note.tags.length > 0 ? note.tags.map(t => `<span class="text-[9px] sm:text-[10px] px-1.5 sm:px-2 py-0.5 bg-black/5 dark:bg-white/10 text-slate-700 dark:text-slate-300 rounded-md font-semibold uppercase truncate max-w-[60px] sm:max-w-[80px]">${t}</span>`).join('') : '<span class="text-[10px] opacity-0">-</span>'}
                            </div>
                            <div class="flex items-center gap-1 sm:gap-2 bg-black/5 dark:bg-white/5 px-1.5 sm:px-2 py-1 rounded-md">
                                ${hasAttachment}
                                <span class="text-[9px] sm:text-[10px] font-medium text-slate-500 ml-1">${new Date(note.updatedAt).toLocaleDateString('tr-TR')}</span>
                            </div>
                        </div>
                    </div>
                `;
                container.appendChild(div);
            });
            lucide.createIcons({ root: document.getElementById('notesContainer') });
            renderTags();
            initSortable();
        }

        // --- Ana Render Yönlendiricisi ---
        function renderNotes() {
            if (currentFilter === 'calendar') {
                renderCalendar();
                return;
            }

            const searchVal = document.getElementById('searchBox').value.toLowerCase();
            let dataList = currentFilter === 'trash' ? trash : notes;
            let filtered = [];
            
            if (currentFilter === 'notes') {
                filtered = dataList.filter(n => n.type === 'note');
            } else if (currentFilter === 'tasks') {
                filtered = dataList.filter(n => n.type === 'task');
            } else if (currentFilter === 'favorites') {
                filtered = dataList.filter(n => n.isFavorite); 
            } else if (currentFilter.startsWith('tag:')) {
                const tag = currentFilter.replace('tag:', '');
                filtered = dataList.filter(n => (n.tags || []).includes(tag));
            } else {
                filtered = dataList; 
            }

            if (searchVal) {
                filtered = filtered.filter(n => 
                    (n.title && n.title.toLowerCase().includes(searchVal)) || 
                    (n.content && n.content.toLowerCase().includes(searchVal)) ||
                    (n.tags && n.tags.some(t => t.toLowerCase().includes(searchVal)))
                );
            }

            if (currentFilter === 'tasks') {
                renderTasksView(filtered);
            } else {
                renderCardsView(filtered);
            }
        }

        function renderTags() {
            const allTags = [...new Set(notes.flatMap(n => n.tags || []))];
            const tagContainer = document.getElementById('tagList');
            tagContainer.innerHTML = '';
            allTags.forEach(tag => {
                const btn = document.createElement('button');
                const isActive = currentFilter === 'tag:'+tag;
                btn.className = `w-full flex items-center gap-3 px-3 py-3 md:py-2 rounded-xl hover:bg-indigo-50 dark:hover:bg-slate-800 text-left transition text-sm font-medium nav-btn ${isActive ? 'bg-indigo-50 text-indigo-600 dark:bg-slate-800 dark:text-indigo-400' : 'text-slate-700 dark:text-slate-300'}`;
                btn.dataset.filter = 'tag:'+tag;
                btn.onclick = () => {
                    setFilter('tag:' + tag);
                    if(window.innerWidth < 768) toggleSidebar();
                };
                btn.innerHTML = `<i data-lucide="hash" class="w-4 h-4"></i> <span class="truncate">${tag}</span>`;
                tagContainer.appendChild(btn);
            });
            lucide.createIcons();
        }

        const handleSearch = debounce(() => { renderNotes(); }, 300);

        function toggleCalendarMode() {
            if (currentFilter === 'calendar') {
                setFilter(localStorage.getItem('notla_filter') || 'notes');
            } else {
                setFilter('calendar');
            }
        }

        function setFilter(filter) {
            if(filter !== 'trash' && !filter.startsWith('tag:')) {
                localStorage.setItem('notla_filter', filter);
            }
            currentFilter = filter;
            
            document.querySelectorAll('.nav-btn').forEach(b => {
                b.classList.remove('bg-indigo-50', 'text-indigo-600', 'dark:bg-slate-800', 'dark:text-indigo-400');
                if (b.dataset.filter === 'trash') {
                    b.classList.add('text-red-500', 'dark:text-red-400');
                } else {
                    b.classList.add('text-slate-700', 'dark:text-slate-300');
                }
                
                if (b.dataset.filter === filter) {
                    b.classList.remove('text-slate-700', 'dark:text-slate-300', 'text-red-500', 'dark:text-red-400');
                    b.classList.add('bg-indigo-50', 'text-indigo-600', 'dark:bg-slate-800', 'dark:text-indigo-400');
                }
            });

            const addBtnText = document.getElementById('mainAddBtnText');
            if (addBtnText) {
                addBtnText.innerText = (filter === 'tasks' || filter === 'calendar') ? 'Yeni Görev' : 'Yeni Not';
            }

            const calBtn = document.getElementById('calendarToggleBtn');
            const calIcon = document.getElementById('calendarIcon');
            if (calBtn && calIcon) {
                if (filter === 'calendar') {
                    calBtn.className = 'relative p-2 bg-gradient-to-r from-indigo-600 to-purple-600 border border-transparent rounded-xl transition-all duration-300 flex items-center justify-center shadow-[0_0_20px_rgba(99,102,241,0.6)] scale-105 group overflow-hidden';
                    calIcon.className = 'w-5 h-5 text-white transform group-hover:scale-110 transition-transform';
                } else {
                    calBtn.className = 'relative p-2 bg-gradient-to-r from-indigo-50 to-purple-50 dark:from-indigo-900/40 dark:to-purple-900/40 border border-indigo-100 dark:border-indigo-800/60 rounded-xl transition-all duration-300 flex items-center justify-center shadow-sm hover:shadow-md hover:shadow-indigo-500/20 group overflow-hidden';
                    calIcon.className = 'w-5 h-5 text-indigo-600 dark:text-indigo-400 transform group-hover:scale-110 transition-transform';
                }
            }
            
            if(window.innerWidth < 768 && filter !== 'calendar' && filter !== currentFilter) {
                toggleSidebar();
            }

            renderNotes();
        }

        function toggleView() {
            viewMode = viewMode === 'grid' ? 'list' : 'grid';
            localStorage.setItem('notla_view', viewMode);
            document.getElementById('viewIcon').setAttribute('data-lucide', viewMode === 'grid' ? 'list' : 'grid');
            renderNotes();
        }

        // --- Bulut ve Yerel Depolama Yönlendiricisi ---
        function saveToStorage() {
            const user = firebase.auth().currentUser;
            
            if (user) {
                // Kullanıcı giriş yapmışsa buluta (Firestore) kaydet
                firebase.firestore().collection('user_notes').doc(user.uid).set({
                    notes: notes,
                    trash: trash,
                    updatedAt: new Date().toISOString()
                }).catch(err => {
                    console.error("Buluta kayıt hatası:", err);
                });
            }
            
            // Cihazda da yerel olarak sakla (yedek olarak)
            localforage.setItem('notla_notes', notes).catch(err => { console.error(err); });
            localforage.setItem('notla_trash', trash).catch(err => { console.error(err); });
        }

        window.onclick = function(event) {
            if (!event.target.closest('button[onclick="toggleExportMenu()"]') && !event.target.closest('#exportMenu')) {
                const exMenu = document.getElementById('exportMenu');
                if (exMenu) exMenu.classList.add('hidden');
            }
            if (event.target.id === 'settingsModal') {
                closeSettings();
            }
            // Araç çubuğu açıkken dışarı bir yere tıklanırsa kapat
            const toolbar = document.getElementById('cardToolbar');
            if (toolbar && !toolbar.classList.contains('hidden') && !event.target.closest('.note-card') && !event.target.closest('#cardToolbar')) {
                closeCardToolbar();
            }
        }
    </script>
</body>
</html>
